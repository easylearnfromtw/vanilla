name: Atuber Library Sandbox
on:
  pull_request:
    paths:
      - 'training/atuber-books/**'
      - 'tests/test_atuber_books_sandbox.py'
      - 'tests/test_atuber_hybrid_relevance.py'
      - 'tests/test_atuber_bulk_fulltext_ingest.py'
      - 'tests/test_atuber_fulltext_qlora_audit.py'
      - '.github/workflows/atuber-library-sandbox.yml'
  workflow_dispatch:
    inputs:
      import_catalogue:
        description: 'Download official NBINet CSV and build metadata-only catalogue'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  test-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline library sandbox tests
        run: |
          python3 -m unittest discover -s tests -p 'test_atuber_books_sandbox.py' -v
          python3 -m unittest discover -s tests -p 'test_atuber_title_weight_sandbox.py' -v
          python3 -m unittest discover -s tests -p 'test_atuber_licensed_content.py' -v
          python3 -m unittest discover -s tests -p 'test_atuber_content_weights.py' -v
          python3 -m unittest discover -s tests -p 'test_atuber_hybrid_relevance.py' -v
          python3 -m unittest discover -s tests -p 'test_atuber_bulk_fulltext_ingest.py' -v
          python3 -m unittest discover -s tests -p 'test_atuber_fulltext_qlora_audit.py' -v
      - name: Downloader dry run
        run: |
          python3 training/atuber-books/download_public_catalogue.py --output "$RUNNER_TEMP/atuber-downloaded"
          test ! -e "$RUNNER_TEMP/atuber-downloaded"

  official-open-metadata:
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && inputs.import_catalogue == true)
    needs: test-offline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download the single official NBINet CSV
        run: |
          python3 training/atuber-books/download_public_catalogue.py --output "$RUNNER_TEMP/nbinet-source" --execute
      - name: Diagnose header names without exposing book content
        run: |
          python3 - <<'PY'
          import csv,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'nbinet-source/nbinet.csv'
          with p.open(encoding='utf-8-sig', newline='') as data:
              reader=csv.reader(data)
              print('CSV HEADER FIELDS (names only):',repr(next(reader, []))[:3500])
          PY
      - name: Index 100k topics and 10k language extension targets
        run: |
          python3 training/atuber-books/catalog_sandbox.py --csv "$RUNNER_TEMP/nbinet-source/nbinet.csv" --source nbinet --output "$RUNNER_TEMP/atuber-book-index" --topic-target 100000 --language-target 10000 --execute
      - name: Train tiny title-classifier weights for one million actual SGD steps
        timeout-minutes: 15
        run: |
          python3 training/atuber-books/title_weight_sandbox.py --database "$RUNNER_TEMP/atuber-book-index/catalog.sqlite3" --output "$RUNNER_TEMP/title-weight-sandbox" --steps 1000000 --execute
      - name: Assert actual small-model optimizer steps and distinguish LLM
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          r=json.loads((root/"title-weight-sandbox/training_report.json").read_text())
          assert r["optimizer_steps_completed"]==1000000
          assert r["scalar_parameter_updates"]>1000000
          assert r["neural_llm_weight_updates"]==0 and r["full_text_books_read"]==0
          assert r["title_drill"]["questions"]>0
          print("Actual tiny-classifier SGD steps:",r["optimizer_steps_completed"])
          print("Parameter scalar updates:",r["scalar_parameter_updates"])
          print("Validation:",r["validation_final"]["accuracy"])
          print("Holdout:",r["holdout_final"]["accuracy"])
          print("Held-out factual title QA count:",r["title_drill"]["questions"])
          with pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as output:
              output.write("\n## Actual tiny title-weight sandbox\n")
              output.write(f'- SGD steps: {r["optimizer_steps_completed"]:,}\n')
              output.write(f'- Validation accuracy: {r["validation_final"]["accuracy"]}\n')
              output.write(f'- Holdout accuracy: {r["holdout_final"]["accuracy"]}\n')
              output.write('- October/Qwen LLM steps: 0; full texts read: 0\n')
          PY
      - name: Build two public-domain historical book text indices (not LLM training)
        timeout-minutes: 10
        run: |
          python3 training/atuber-books/public_domain_pilot.py --output "$RUNNER_TEMP/atuber-public-domain-pilot" --execute
      - name: Verify public-domain pilot citations and retain no texts
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          r=json.loads((root/"atuber-public-domain-pilot/pilot_report.json").read_text())
          assert r["books_indexed"]==2
          assert r["econ_search_has_evidence"] and r["philosophy_search_has_evidence"]
          assert r["llm_weight_updates"]==0
          print("Full historical books indexed for evidence retrieval:",r["books_indexed"])
          print("Evidence chunks:",r["chunks_indexed"])
          with pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as output:
              output.write("\n## Public-domain full-book RAG pilot (not weights)\n")
              output.write(f'- Full texts indexed privately: {r["books_indexed"]}\n')
              output.write(f'- Evidence chunks: {r["chunks_indexed"]}\n')
              output.write('- LLM gradient updates: 0; corpus not uploaded\n')
          PY
      - name: One million actual lexical-content classifier SGD steps from two approved historical texts
        timeout-minutes: 15
        run: |
          python3 training/atuber-books/content_weight_sandbox.py --index "$RUNNER_TEMP/atuber-public-domain-pilot/approved_content.sqlite3" --output "$RUNNER_TEMP/content-weight-sandbox" --steps 1000000 --execute
      - name: Validate content-weight updates without claiming LLM training
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          r=json.loads((root/"content-weight-sandbox/report.json").read_text())
          assert r["optimizer_steps_completed"]==1000000
          assert r["books_training_source_count"]==2
          assert r["scalar_parameter_updates"]>1000000
          assert r["llm_optimizer_steps"]==0
          print("Real tiny content model SGD steps:",r["optimizer_steps_completed"])
          print("Scalar content weight updates:",r["scalar_parameter_updates"])
          print("Unseen passage holdout accuracy:",r["holdout_final"]["accuracy"])
          print("Unseen passage holdout baseline:",r["holdout_baseline"]["accuracy"])
          with pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as output:
              output.write("\n## Actual tiny book-content lexical classifier SGD\n")
              output.write(f'- SGD steps on two real books: {r["optimizer_steps_completed"]:,}\n')
              output.write(f'- Heldout passage classification: {r["holdout_final"]["accuracy"]}\n')
              output.write('- Qwen/October neural LLM weight updates: 0\n')
          PY
      - name: Index entire official source catalogue and all authorized full-text sources
        timeout-minutes: 15
        run: |
          python3 training/atuber-books/hybrid_library.py --catalogue "$RUNNER_TEMP/atuber-book-index/catalog.sqlite3" --raw-csv "$RUNNER_TEMP/nbinet-source/nbinet.csv" --content-index "$RUNNER_TEMP/atuber-public-domain-pilot/approved_content.sqlite3" --output "$RUNNER_TEMP/atuber-hybrid-library.sqlite3" --execute
      - name: Export official open-bibliography searchable SQLite without copyrighted full text
        timeout-minutes: 15
        run: |
          python3 training/atuber-books/hybrid_library.py --raw-csv "$RUNNER_TEMP/nbinet-source/nbinet.csv" --output "$RUNNER_TEMP/atuber-public-metadata.sqlite3" --execute
      - name: Audit metadata-only export
        run: |
          python3 - <<'PY'
          import sqlite3,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"atuber-public-metadata.sqlite3"
          with sqlite3.connect(p) as c:
              count=c.execute("SELECT COUNT(*) FROM books").fetchone()[0]
              full=c.execute("SELECT COUNT(*) FROM paragraphs").fetchone()[0]
              assert count>=10000 and full==0
          print("Safe open book records exported:",count,"Full text in export:",full)
          PY
      - name: One million real SGD steps for fuzzy/related book relevance
        timeout-minutes: 15
        run: |
          python3 training/atuber-books/fuzzy_relevance_train.py --index "$RUNNER_TEMP/atuber-hybrid-library.sqlite3" --output "$RUNNER_TEMP/atuber-relevance" --steps 1000000 --execute
      - name: Verify ranked source-backed book and exact rights coverage
        run: |
          python3 - <<'PY'
          import json,os,pathlib,sys
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          library=json.loads((root/"atuber-hybrid-library.report.json").read_text())
          rank=json.loads((root/"atuber-relevance/report.json").read_text())
          assert library["catalogue_only_records"]>=10000
          assert library["rights_cleared_fulltext_books"]==2
          assert library["fulltext_passages"]>=3000
          assert rank["optimizer_steps_completed"]==1000000
          assert rank["qwen_october_llm_weight_updates"]==0
          sys.path.insert(0,"training/atuber-books")
          from hybrid_library import search
          r=search(root/"atuber-hybrid-library.sqlite3","division of labor",5,root/"atuber-relevance/ranker.json")
          assert any(x["citation_scope"]=="original-text-passage" for x in r["items"])
          s=search(root/"atuber-hybrid-library.sqlite3","股票投資",5,root/"atuber-relevance/ranker.json")
          assert s["items"] and any(x["source_scope"]=="catalogue-dataset" for x in s["items"])
          assert all(x["availability"]=="metadata-only" and x["evidence"] is None
                     for x in s["items"] if x["source_scope"]=="catalogue-dataset")
          assert all(x["evidence"] is not None
                     for x in s["items"] if x["citation_scope"]=="original-text-passage")
          print("Raw unique catalogue records:",library["catalogue_only_records"])
          print("Actual full-text works:",library["rights_cleared_fulltext_books"])
          print("Indexed text chunks:",library["fulltext_passages"])
          print("Real fuzzy ranker SGD:",rank["optimizer_steps_completed"])
          print("Synthetic heldout book pair relevance:",rank["holdout_after"]["accuracy"])
          with pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as f:
              f.write("\n## Complete supplied library / grounded image-citation metadata\n")
              f.write(f'- Catalogue-only records: {library["catalogue_only_records"]:,}\n')
              f.write(f'- Copyright/rights-reviewed fulltext books: {library["rights_cleared_fulltext_books"]:,}\n')
              f.write(f'- Total full-text passages: {library["fulltext_passages"]:,}\n')
              f.write(f'- Fuzzy relevance SGD updates: {rank["optimizer_steps_completed"]:,}\n')
              f.write(f'- Heldout synthetic relevance-pair accuracy: {rank["holdout_after"]["accuracy"]}\n')
              f.write('- No GPU/LLM fine-tune; no unlicensed fulltext or cover downloads.\n')
          PY
      - name: Report measured records, never fake training
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          result = json.loads((root/'atuber-book-index/report.json').read_text())
          download = json.loads((root/'nbinet-source/download_provenance.json').read_text())
          count = result['actual']['indexed_unique']
          print('Download source:', download['source_page'])
          print('SHA256:', download['download_sha256'])
          print('Unique catalogue records:', count)
          print('Quotas fulfilled:', result['targets_reached'])
          print('Books read (full text):', result['book_full_texts_read'])
          print('Weight updates:', result['weight_updates'])
          summary = pathlib.Path(os.environ['GITHUB_STEP_SUMMARY'])
          with summary.open('a') as f:
              f.write('## Atuber official library metadata import\n\n')
              f.write(f'- Unique book metadata records: {count:,}\n')
              f.write(f'- Download SHA256: {download["download_sha256"]}\n')
              f.write(f'- Full targets reached: {result["targets_reached"]}\n')
              f.write('- Full texts read: 0; model weight updates: 0\n')
          if count < 1:
              raise SystemExit('No classified metadata records, inspect original CSV columns')
          PY
      - name: Publish only public bibliographic metadata SQLite for reproducible use
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: atuber-public-book-metadata-index
          path: |
            ${{ runner.temp }}/atuber-public-metadata.sqlite3
            ${{ runner.temp }}/atuber-public-metadata.report.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload audit reports only, no corpus or full text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atuber-open-library-metadata-reports
          path: |
            ${{ runner.temp }}/nbinet-source/download_provenance.json
            ${{ runner.temp }}/atuber-book-index/report.json
            ${{ runner.temp }}/title-weight-sandbox/training_report.json
            ${{ runner.temp }}/title-weight-sandbox/weights.json
            ${{ runner.temp }}/title-weight-sandbox/title_holdout_questions.jsonl
            ${{ runner.temp }}/atuber-public-domain-pilot/pilot_report.json
            ${{ runner.temp }}/content-weight-sandbox/report.json
            ${{ runner.temp }}/content-weight-sandbox/content_weights.json
            ${{ runner.temp }}/atuber-hybrid-library.report.json
            ${{ runner.temp }}/atuber-relevance/report.json
            ${{ runner.temp }}/atuber-relevance/ranker.json
          if-no-files-found: warn
          retention-days: 7
