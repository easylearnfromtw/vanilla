name: Atuber Real CPU LoRA Proof
on:
  pull_request:
    paths:
      - 'training/atuber/cpu_lora_pilot.py'
      - 'tests/test_atuber_cpu_lora_pilot.py'
      - '.github/workflows/atuber-real-cpu-lora.yml'
  push:
    branches: [main]
    paths:
      - 'training/atuber/cpu_lora_pilot.py'
      - 'tests/test_atuber_cpu_lora_pilot.py'
      - '.github/workflows/atuber-real-cpu-lora.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-licensed-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate real training preconditions without downloading model
        run: python3 -m unittest discover -s tests -p 'test_atuber_cpu_lora_pilot.py' -v

  real-qwen-cpu-lora:
    # Explicitly prohibit training PR code; run only after merged owner push
    # or manual workflow dispatch, with approved official arXiv source.
    if: ${{ github.event_name != 'pull_request' }}
    needs: validate-licensed-source
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HF_HOME: /tmp/atuber-hf-cache
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify host hardware and disk honestly
        run: |
          python3 - <<'PY'
          import os,platform,shutil
          print("CPU Architecture:",platform.machine())
          print("Visible CPUs:",os.cpu_count())
          print("Temporary disk available GB:",round(shutil.disk_usage(os.environ["RUNNER_TEMP"]).free/2**30,1))
          print("GitHub-hosted ordinary ubuntu-latest is a CPU runner; no CUDA training is being claimed.")
          PY
      - name: Install explicitly CPU-only PyTorch and adapter dependencies
        run: |
          python3 -m pip install --no-cache-dir 'torch==2.6.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install --no-cache-dir 'transformers>=4.53,<5' 'peft>=0.17,<0.24' 'accelerate>=1.3,<2' 'pypdf>=5,<7'
      - name: Download one real PDF only after official license verification
        run: |
          python3 training/scholarly/live_ingest.py \
            --arxiv-id 1410.6579 \
            --output "$RUNNER_TEMP/verified-scholarly-fulltext" \
            --execute
      - name: Train real Qwen3-0.6B adapter on CPU
        run: |
          python3 -u training/atuber/cpu_lora_pilot.py \
            --index "$RUNNER_TEMP/verified-scholarly-fulltext.sqlite3" \
            --output "$RUNNER_TEMP/atuber-real-cpu-lora" \
            --steps 2 --sequence-length 64 --train
      - name: Verify real gradients, adapter weights and document limits
        run: |
          python3 - <<'PY'
          import json,os,pathlib,hashlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"atuber-real-cpu-lora"
          report=json.loads((root/"training-provenance.json").read_text(encoding="utf8"))
          model=root/"adapter/adapter_model.safetensors"
          h=hashlib.sha256(model.read_bytes()).hexdigest()
          assert report["trained"] is True and report["actual_optimizer_steps"] == 2
          assert report["weight_delta_verified"] is True
          assert report["adapter_sha256"] == h
          assert report["cuda_used"] is False and report["cpu_only"] is True
          assert report["scientific_correctness_tested"] is False
          assert report["independent_document_evaluation"] is False
          print("REAL TRAINED ATUBER 0.6B ADAPTER:",model.stat().st_size,"bytes")
          print("ACTUAL OPTIMIZER STEPS:",report["actual_optimizer_steps"])
          print("LORA WEIGHTS SHA256:",h)
          print("IMPORTANT: proof-of-execution, not a release-quality factual model")
          with pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as f:
            f.write("## Atuber Qwen3-0.6B — REAL CPU LoRA training\n")
            f.write(f'- Optimizer steps actually completed: **{report["actual_optimizer_steps"]}**\n')
            f.write(f'- Real safetensors adapter: **{model.stat().st_size:,} bytes**\n')
            f.write(f'- Gradient update and weight delta verified: **{report["weight_delta_verified"]}**\n')
            f.write(f'- Source licensed arXiv article: {report["source_url"]}\n')
            f.write(f'- Adapter SHA256: `{h}`\n')
            f.write('- No CUDA, no independent-paper evaluation and no claim of 100-paper training.\n')
          PY
      - name: Retain real trained adapter privately as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: atuber-qwen3-06b-real-cpu-lora-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/atuber-real-cpu-lora/training-provenance.json
            ${{ runner.temp }}/atuber-real-cpu-lora/adapter/
          retention-days: 7
          if-no-files-found: error
