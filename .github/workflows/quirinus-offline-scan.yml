name: Quirinus Offline Source Scan
run-name: Quirinus ${{ github.event_name == 'workflow_dispatch' && format('approved {0}', inputs.request_id || 'manual') || github.event_name }}
on:
  # Workflow definition comes from trusted base, never from a submitted PR.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'src/**'
      - 'services/**'
      - 'tests/**'
      - 'deployment/quirinus/**'
      - '.github/workflows/quirinus-offline-scan.yml'
  schedule:
    # UTC 01:19 = Taiwan 09:19 daily; GitHub scheduling may be delayed.
    - cron: '19 1 * * *'
  workflow_dispatch:
    inputs:
      request_id:
        description: "Opaque approval correlation ID; do not enter secrets"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'services/**'
      - 'tests/**'
      - 'deployment/quirinus/**'
      - '.github/workflows/quirinus-offline-scan.yml'

permissions:
  contents: read

concurrency:
  group: quirinus-offline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  offline-code-scan:
    # PR head is inert, read-only Docker input. No secret/write permissions.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout target revision as untrusted data
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: false
          lfs: false
          path: target-source
      - name: Checkout trusted scanner from main base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
          path: trusted-scanner
      - name: Build pinned scanner image from trusted base only
        run: docker build --pull -f trusted-scanner/deployment/quirinus/Dockerfile -t vanilla-quirinus:v0.4.1 trusted-scanner
      - name: Run sealed offline source scan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/quirinus-output"
          chmod 0777 "$RUNNER_TEMP/quirinus-output"
          docker run --rm \
            --network none \
            --read-only \
            --user 10001:10001 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 64 \
            --memory 768m \
            --cpus 1 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
            --mount "type=bind,source=$PWD/target-source/src,target=/scan-src/src,readonly" \
            --mount "type=bind,source=$PWD/target-source/services,target=/scan-src/services,readonly" \
            --mount "type=bind,source=$PWD/target-source/tests,target=/scan-src/tests,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/quirinus-output,target=/output" \
            --env QUIRINUS_ENABLED=true \
            --env QUIRINUS_ISOLATED=true \
            --env QUIRINUS_SOURCE_READONLY=true \
            vanilla-quirinus:v0.4.1
          test -s "$RUNNER_TEMP/quirinus-output/quirinus-summary.json"
          test -s "$RUNNER_TEMP/quirinus-output/quirinus-summary.md"
          cat "$RUNNER_TEMP/quirinus-output/quirinus-summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Check PR high-risk regression against trusted base
        if: github.event_name == 'pull_request_target'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/quirinus-baseline"
          chmod 0777 "$RUNNER_TEMP/quirinus-baseline"
          # The trusted base itself is scanned independently; never trust
          # source supplied by a PR to change the scanner or policy.
          docker run --rm \
            --network none \
            --read-only \
            --user 10001:10001 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 64 \
            --memory 768m \
            --cpus 1 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
            --mount "type=bind,source=$PWD/trusted-scanner/src,target=/scan-src/src,readonly" \
            --mount "type=bind,source=$PWD/trusted-scanner/services,target=/scan-src/services,readonly" \
            --mount "type=bind,source=$PWD/trusted-scanner/tests,target=/scan-src/tests,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/quirinus-baseline,target=/output" \
            --env QUIRINUS_ENABLED=true \
            --env QUIRINUS_ISOLATED=true \
            --env QUIRINUS_SOURCE_READONLY=true \
            vanilla-quirinus:v0.4.1
          test -s "$RUNNER_TEMP/quirinus-baseline/quirinus-summary.json"
          python3 trusted-scanner/deployment/quirinus/regression_check.py \
            "$RUNNER_TEMP/quirinus-baseline/quirinus-summary.json" \
            "$RUNNER_TEMP/quirinus-output/quirinus-summary.json" \
            "$GITHUB_STEP_SUMMARY"
      - name: Archive aggregate summary only (no vulnerability locations)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quirinus-safe-summary
          path: |
            ${{ runner.temp }}/quirinus-output/quirinus-summary.json
            ${{ runner.temp }}/quirinus-output/quirinus-summary.md
          retention-days: 7
          if-no-files-found: error

  # Only validated aggregate scan results cross this job boundary.
  # Pull requests NEVER receive issue-write privileges or execute this job.
  alert-owner:
    name: Quirinus aggregate alert
    needs: [offline-code-scan]
    if: (github.event_name == 'push' || github.event_name == 'schedule') && needs.offline-code-scan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Checkout trusted alert code without saved credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download sanitized aggregate from this workflow run
        uses: actions/download-artifact@v4
        with:
          name: quirinus-safe-summary
          path: quirinus-safe
      - name: Validate CREAM counts with strict redaction
        shell: bash
        run: |
          set -euo pipefail
          python3 deployment/quirinus/autonomous_alert.py quirinus-safe/quirinus-summary.json > "$RUNNER_TEMP/quirinus-alert.json"
      - name: Open or update one aggregate review issue if elevated risk
        uses: actions/github-script@v7
        env:
          QUIRINUS_SAFE_ALERT: ${{ runner.temp }}/quirinus-alert.json
        with:
          script: |
            const fs = require('fs');
            const summary = JSON.parse(fs.readFileSync(process.env.QUIRINUS_SAFE_ALERT, 'utf8'));
            if (!summary.alert) {
              core.info('No elevated risk; never auto-close an existing review issue.');
              return;
            }
            const count = summary.severityCounts;
            const marker = '<!-- vanilla-quirinus-autonomous-v1 -->';
            const stamp = '<!-- quirinus-fingerprint:' + summary.fingerprint + ' -->';
            const title = 'Quirinus · automated security review (aggregate only)';
            const actionsUrl = 'https://github.com/' + context.repo.owner + '/' + context.repo.repo
              + '/actions/runs/' + context.runId;
            const body = [
              marker, stamp, '### Automatic Quirinus review',
              '',
              'This issue tracks static-rule findings, NOT confirmed exploitable vulnerabilities.',
              '',
              '| Metric | Aggregate |', '| --- | ---: |',
              '| Source files | ' + summary.filesScanned + ' |',
              '| Total rule findings | ' + summary.totalFindings + ' |',
              '| Critical | ' + count.Critical + ' |',
              '| High | ' + count.High + ' |',
              '| Medium | ' + count.Medium + ' |',
              '| Low | ' + count.Low + ' |',
              '| Info | ' + count.Info + ' |',
              '| Truncated results | ' + summary.truncated + ' |',
              '',
              'Aggregate last changed: ' + actionsUrl,
              '',
              'Source, evidence, paths, secret values and repair backlogs are intentionally omitted.',
              'Please confirm findings privately. No automatic code edits, merges or deploys.'
            ].join('\n');
            const { owner, repo } = context.repo;
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100
            });
            const issue = open.find(i => !i.pull_request && i.title === title
              && (i.body || '').includes(marker));
            if (issue) {
              if ((issue.body || '').includes(stamp)) {
                core.info('Already reported identical aggregate; no duplicate notification.');
                return;
              }
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, body });
              core.info('Updated aggregate review issue #' + issue.number);
            } else {
              const created = await github.rest.issues.create({ owner, repo, title, body });
              core.info('Opened sanitized review issue #' + created.data.number);
            }
