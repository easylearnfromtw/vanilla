services:
  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    networks: [isolated]
    volumes:
      - clam-db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--version"]
      interval: 60s
      timeout: 10s
  athena:
    build: .
    restart: unless-stopped
    depends_on: [clamav]
    environment:
      ATHENA_SCAN_TOKEN: ${ATHENA_SCAN_TOKEN:?set in a private local .env}
      ATHENA_BIND_HOST: 0.0.0.0
      ATHENA_PORT: 8788
      CLAM_HOST: clamav
      CLAM_PORT: 3310
    ports:
      - "127.0.0.1:8788:8788"
    networks: [isolated]
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs: [/tmp]
networks:
  isolated:
    internal: true
volumes:
  clam-db: