# Optional metadata-only LUCA -> private collector -> Tracely.
# Never publish port 4318. Use a private Docker network shared with WeiGuo.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 2s
    limit_mib: 96
  filter/luca_only:
    error_mode: ignore
    traces:
      span:
        - 'name != "luca.operation"'
  transform/hank_allowlist:
    error_mode: propagate
    trace_statements:
      - context: span
        statements:
          - keep_keys(attributes, ["component", "operation", "status_code", "duration_ms"])
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name"])
  batch:
    timeout: 5s
    send_batch_size: 32
exporters:
  otlphttp/tracely:
    endpoint: ${env:TRACELY_API}
    headers:
      Authorization: "Bearer ${env:TRACELY_KEY}"
    timeout: 5s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 8s
      max_elapsed_time: 20s
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/luca_only, transform/hank_allowlist, batch]
      exporters: [otlphttp/tracely]
