name: Quirinus Security Tool Checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quirinus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Vanilla frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Verify Detroit and WeiGuo registry contracts
        run: npm run test:detroit-factory
      - name: Validate TypeScript and PWA build
        run: npm run build
        env:
          GITHUB_PAGES: "true"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install only existing WeiGuo Python test requirements
        run: python -m pip install -r services/weiguo/requirements.txt
      - name: Verify PR regression checks reject unsafe or increasing risk
        run: python -m unittest discover -s services/weiguo -p 'test_quirinus_regression.py'
      - name: Verify proactive issue alert redaction and schema
        run: python -m unittest discover -s services/weiguo -p 'test_quirinus_autonomous.py'
      - name: Verify Quirinus secure adapter without external VulnClaw
        run: python -m unittest discover -s services/weiguo -p 'test_quirinus_adapter.py'
      - name: Verify owner-approved Quirinus family gateway
        run: python -m unittest discover -s services/weiguo -p 'test_quirinus_family_actions.py'
      - name: Verify Quirinus adapter syntax
        run: python -m py_compile services/weiguo/quirinus_adapter.py services/weiguo/detroit_quirinus_dispatcher.py
      - name: Verify approved Detroit dispatch, CREAM summary and JENSEN handoff
        run: python -m unittest discover -s services/weiguo -p 'test_detroit_quirinus_dispatcher.py'
