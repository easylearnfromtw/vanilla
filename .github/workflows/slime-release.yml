name: Slime Installer Release
on:
  workflow_dispatch:
  pull_request:
    branches: ['main']
    paths:
      - 'services/slime/**'
      - 'services/weiguo/slime_desktop.py'
      - 'services/weiguo/slime_welcome.py'
      - 'tests/test_slime_first_run_gui.py'
      - 'deployment/slime/**'
      - 'tests/test_slime_sandbox_center.py'
      - 'tests/test_slime_sandbox_bundle.py'
      - '.github/workflows/slime-release.yml'
  push:
    branches: ['main']
    tags: ['slime-v*']
    paths:
      - '.github/workflows/slime-release.yml'
      - 'services/weiguo/slime_desktop.py'
      - 'services/weiguo/slime_runner_agent.py'
      - 'services/weiguo/slime_success.py'
      - 'services/weiguo/gecko_lan.py'
      - 'services/weiguo/gecko_update.py'
      - 'deployment/slime/**'
      - 'services/slime/**'
      - 'training/atuber/**'
      - 'training/atuber-books/**'
      - 'training/octuber-gpu-sandbox/**'
      - 'training/scholarly/**'
      - 'training/octuber-finance/**'
      - 'services/slime/finance_training.py'
      - 'services/slime/finance_training_window.py'
env:
  PYTHONIOENCODING: utf-8
permissions:
  contents: read

# Multiple code pushes do not race to publish mismatched installer binaries.
concurrency:
  group: slime-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify source and build standalone executables
        shell: pwsh
        run: |
          python -m py_compile services/weiguo/slime_desktop.py services/weiguo/slime_welcome.py services/weiguo/slime_runner_agent.py services/weiguo/slime_success.py services/weiguo/gecko_lan.py services/weiguo/gecko_update.py
          python -m unittest discover -s tests -p test_slime_desktop.py
          python -m unittest discover -s tests -p test_slime_first_run_gui.py
          python -m unittest discover -s tests -p test_slime_sandbox_center.py
          python -m unittest discover -s tests -p test_slime_local_model_tools.py
          python -m unittest discover -s tests -p test_slime_training_evidence.py
          python -m unittest discover -s tests -p test_slime_github_training_monitor.py
          python -m unittest discover -s tests -p test_slime_owner_tools_shortcuts.py
          python -m unittest discover -s tests -p test_slime_finance_training.py
          python -m pip install "pyinstaller==6.16.0"
          python -m PyInstaller --noconfirm --clean --onefile --console --name Slime-Owner --hidden-import slime_welcome --hidden-import gecko_lan --hidden-import gecko_update --paths services/weiguo --paths services/slime --hidden-import unified_tools_window --hidden-import sandbox_window --hidden-import local_model_window --hidden-import sandbox_center --hidden-import local_model_tools --hidden-import github_training_window --hidden-import github_training_status --hidden-import finance_training_window --hidden-import finance_training services/weiguo/slime_desktop.py
          python -m PyInstaller --noconfirm --clean --onefile --console --name Slime-Friend --hidden-import slime_welcome --hidden-import gecko_lan --hidden-import gecko_update --paths services/weiguo services/weiguo/slime_desktop.py
          if (!(Test-Path dist/Slime-Owner.exe) -or !(Test-Path dist/Slime-Friend.exe)) { throw "Missing executables" }
          Copy-Item deployment/slime/install-windows-autostart.ps1 dist/Slime-Windows-Autostart.ps1
          Copy-Item deployment/slime/Slime-Owner-Tools.cmd dist/Slime-Owner-Tools.cmd
          if (!(Test-Path dist/Slime-Owner-Tools.cmd)) { throw 'SLIME_OWNER_TOOLS_LAUNCHER_MISSING' }
      - uses: actions/upload-artifact@v4
        with:
          name: slime-windows-build
          path: |
            dist/Slime-Owner.exe
            dist/Slime-Friend.exe
            dist/Slime-Windows-Autostart.ps1
            dist/Slime-Owner-Tools.cmd
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Prepare macOS archive
        run: |
          python3 -m unittest discover -s tests -p test_slime_owner_tools_shortcuts.py
          python3 -m unittest discover -s tests -p test_slime_first_run_gui.py
          python3 -m unittest discover -s tests -p test_slime_finance_training.py
          python3 -m py_compile services/weiguo/slime_desktop.py services/weiguo/slime_welcome.py services/weiguo/slime_runner_agent.py services/weiguo/slime_success.py services/weiguo/gecko_lan.py services/weiguo/gecko_update.py
          mkdir -p dist
          cp services/weiguo/slime_desktop.py services/weiguo/slime_welcome.py services/weiguo/slime_runner_agent.py services/weiguo/slime_success.py services/weiguo/gecko_lan.py services/weiguo/gecko_update.py dist/
          cp deployment/slime/install-macos-autostart.sh dist/install-macos-autostart.sh
          mkdir -p dist/slime_tools
          cp services/slime/*.py dist/slime_tools/
          for role in Owner Friend; do
            cp "deployment/slime/Slime-${role}.command" "dist/Slime-${role}.command"
            chmod +x "dist/Slime-${role}.command"
            if [ "$role" = "Owner" ]; then
              cp deployment/slime/Slime-Owner-Tools.command dist/
              chmod +x dist/Slime-Owner-Tools.command
              cd dist
              zip -qr "Slime-${role}-macos.zip" "Slime-${role}.command" Slime-Owner-Tools.command slime_desktop.py slime_welcome.py slime_runner_agent.py slime_success.py gecko_lan.py gecko_update.py install-macos-autostart.sh slime_tools
              cd ..
            else
              cd dist
              # Friend has no Owner toolbox, training modules or local shell entry.
              rm -rf slime_tools
              zip -qr "Slime-${role}-macos.zip" "Slime-${role}.command" slime_desktop.py slime_welcome.py slime_runner_agent.py slime_success.py gecko_lan.py gecko_update.py install-macos-autostart.sh
              cd ..
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: slime-macos-build
          path: dist/*-macos.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Prepare Linux archive
        run: |
          python3 -m py_compile services/weiguo/slime_desktop.py services/weiguo/slime_runner_agent.py services/weiguo/gecko_lan.py services/weiguo/gecko_update.py
          python3 -m unittest discover -s tests -p test_slime_desktop.py
          python3 -m unittest discover -s tests -p test_slime_first_run_gui.py
          python3 -m unittest discover -s tests -p test_slime_sandbox_center.py
          python3 -m unittest discover -s tests -p test_slime_sandbox_bundle.py
          python3 -m unittest discover -s tests -p test_slime_local_model_tools.py
          python3 -m unittest discover -s tests -p test_slime_training_evidence.py
          python3 -m unittest discover -s tests -p test_slime_github_training_monitor.py
          python3 -m unittest discover -s tests -p test_slime_owner_tools_shortcuts.py
          python3 -m unittest discover -s tests -p test_slime_first_run_gui.py
          python3 -m unittest discover -s tests -p test_slime_finance_training.py
          mkdir -p dist
          for role in Owner Friend; do
            mkdir -p "tmp-$role"
            cp services/weiguo/slime_desktop.py services/weiguo/slime_welcome.py services/weiguo/slime_runner_agent.py services/weiguo/slime_success.py services/weiguo/gecko_lan.py services/weiguo/gecko_update.py "tmp-$role/"
            role_lower=$(echo "$role" | tr '[:upper:]' '[:lower:]')
            cp "deployment/slime/launch-${role_lower}.sh" "tmp-$role/start-slime.sh"
            cp deployment/slime/install-linux-autostart.sh "tmp-$role/install-linux-autostart.sh"
            mkdir -p "tmp-$role/slime_tools"
            cp services/slime/*.py "tmp-$role/slime_tools/"
            chmod +x "tmp-$role/start-slime.sh"
            if [ "$role" = "Owner" ]; then
              cp deployment/slime/launch-owner-tools.sh "tmp-$role/start-slime-tools.sh"
              chmod +x "tmp-$role/start-slime-tools.sh"
            else
              rm -rf "tmp-$role/slime_tools"  # Friend never receives Owner tools
            fi
            tar -czf "dist/Slime-${role}-linux.tar.gz" -C "tmp-$role" .
          done
          python3 deployment/slime/build-unified-toolkit.py --output dist/Slime-Sandbox-Toolkit.zip
      - uses: actions/upload-artifact@v4
        with:
          name: slime-linux-build
          path: |
            dist/*-linux.tar.gz
            dist/Slime-Sandbox-Toolkit.zip
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/slime-v') || github.ref == 'refs/heads/main'
    needs: [windows,macos,linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: slime-*-build
          merge-multiple: true
          path: release
      - name: Check assets and hashes
        run: |
          cd release
          for item in Slime-Owner.exe Slime-Friend.exe Slime-Owner-Tools.cmd Slime-Windows-Autostart.ps1 Slime-Owner-macos.zip Slime-Friend-macos.zip Slime-Owner-linux.tar.gz Slime-Friend-linux.tar.gz Slime-Sandbox-Toolkit.zip; do
            test -s "$item"
          done
          # Reject any Owner local-tool module in a Friend release archive.
          if unzip -Z1 Slime-Friend-macos.zip | grep -Eq '^slime_tools/'; then
            echo "Owner toolbox leaked to Friend macOS" >&2
            exit 1
          fi
          if tar -tzf Slime-Friend-linux.tar.gz | grep -Eq '^./slime_tools/'; then
            echo "Owner toolbox leaked to Friend Linux" >&2
            exit 1
          fi
          # The first-run dashboard must ship on both roles and the Owner
          # finance tools must stay Owner-only.
          for role in Owner Friend; do
            unzip -Z1 "Slime-${role}-macos.zip" | grep -Fxq "slime_welcome.py"
            tar -tzf "Slime-${role}-linux.tar.gz" | grep -Fxq "./slime_welcome.py"
          done
          # Verify Owner tools launchers exist only in Owner packages; Friend
          # must not offer a privileged launch shortcut.
          unzip -Z1 Slime-Owner-macos.zip | grep -qx "Slime-Owner-Tools.command"
          if unzip -Z1 Slime-Friend-macos.zip | grep -q "Slime-Owner-Tools.command"; then
            echo "Owner tools shortcut leaked into Friend macOS package" >&2
            exit 1
          fi
          tar -tzf Slime-Owner-linux.tar.gz | grep -Eq "^[.]/start-slime-tools.sh$"
          if tar -tzf Slime-Friend-linux.tar.gz | grep -q "start-slime-tools.sh"; then
            echo "Owner tools shortcut leaked into Friend Linux package" >&2
            exit 1
          fi
          # Public Friend builds must not bundle the OCTUBER Owner financial
          # training launcher; Owner bundles must contain both reviewed modules.
          for script in finance_training.py finance_training_window.py; do
            unzip -Z1 Slime-Owner-macos.zip | grep -Fxq "slime_tools/$script"
            tar -tzf Slime-Owner-linux.tar.gz | grep -Fxq "./slime_tools/$script"
            if unzip -Z1 Slime-Friend-macos.zip | grep -Fxq "slime_tools/$script"; then
              echo "Private financial training module leaked to Friend macOS: $script" >&2
              exit 1
            fi
            if tar -tzf Slime-Friend-linux.tar.gz | grep -Fxq "./slime_tools/$script"; then
              echo "Private financial training module leaked to Friend Linux: $script" >&2
              exit 1
            fi
          done
          sha256sum Slime-* > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/slime-v* ]]; then
            release_tag="$GITHUB_REF_NAME"
            target_args=(--verify-tag)
          else
            # No write-capable create-tag connector is required: gh release
            # creates this unique immutable tag at the exact tested commit.
            release_tag="slime-v$(date -u +%Y%m%d)-${GITHUB_SHA:0:12}"
            target_args=(--target "$GITHUB_SHA")
          fi
          cat > /tmp/slime-release-notes.md <<'NOTES'
          # SLIME · 新版桌面首次使用與 OCTUBER 金融訓練

          此版本將 OCTUBER 1996–2026 全球 20 大市場的金融資料稽核、
          五種模型（0.6B、4B、14B、30B、32B）QLoRA 訓練介面整合到
          **SLIME Owner** 的本機工具中。

          - **全新下載後體驗**：Windows/macOS/Linux 開啟 SLIME 即進入本機配對精靈及節點儀表板。
          - 配對碼有效性、HTTPS 故障、心跳、Owner 推論許可與本機 Ollama 狀態分別顯示；
            配對完成不再自動開啟 Google 獎勵頁，須使用者自行點選。
          - 「開始共享／停止共享／解除配對」有明確授權與取消路徑，停止後不接收新的模型工作；
            進階 CLI 與自願授權的自動啟動功能仍保留。
          - 首次使用與疑難排解：https://github.com/easylearnfromtw/vanilla/blob/main/docs/SLIME_AFTER_INSTALL_GUIDE.md
          - Owner 可手動選擇授權行情與審核資料，檢查來源雜湊、時序切分、CUDA 與顯存。
          - 需要本人逐項同意 GPU 運算、資料權利及模型授權，才可啟動本機訓練。
          - Friend 不包含這兩個金融訓練模組；Telegram／網頁不能遠端派工訓練。
          - 60B 相容性尚未驗證，保持停用。
          - 附 Windows、macOS、Linux Owner／Friend 安裝包與 SHA256SUMS.txt。
          - 目前沒有內含任何已訓練的金融模型權重；正式資料與 CUDA 訓練需自行提供。
          - 尚未提供安裝程式碼簽章或 macOS 公證。請核對校驗碼，只從官方 Releases 下載。

          原始碼及操作指引：
          https://github.com/easylearnfromtw/vanilla/blob/main/docs/SLIME_OCTUBER_FINANCE_TRAINING.md
          NOTES
          gh release create "$release_tag" release/* --repo "$GITHUB_REPOSITORY" \
            --title "Slime $release_tag · OCTUBER Finance" \
            --notes-file /tmp/slime-release-notes.md "${target_args[@]}"
