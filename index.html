<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"/>
<meta name="theme-color" content="#f4eee6"/>
<meta name="color-scheme" content="light"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Vanilla"/>
<meta name="format-detection" content="telephone=no"/>
<meta name="description" content="Vanilla AI — 家庭專屬、本地優先的智慧助理"/>
<link rel="manifest" href="./manifest.webmanifest"/>
<link rel="icon" type="image/png" sizes="32x32" href="./brand/icon-32.png"/>
<link rel="icon" type="image/png" sizes="192x192" href="./brand/icon-192.png"/>
<link rel="apple-touch-icon" sizes="180x180" href="./brand/icon-180.png"/>
<link rel="apple-touch-icon" sizes="167x167" href="./brand/icon-167.png"/>
<link rel="apple-touch-icon" sizes="152x152" href="./brand/icon-152.png"/>
<title>Vanilla AI</title>
<style>
html,body{background:#f4eee6}
#boot-status{position:fixed;inset:0;background:#f4eee6;z-index:99999;display:flex;align-items:center;justify-content:center;font-family:Futura,"Avenir Next",-apple-system,BlinkMacSystemFont,sans-serif;color:#141414;padding:24px}
#boot-status .boot-inner{max-width:420px;text-align:center}
#boot-status img{width:84px;height:84px;border-radius:20px;box-shadow:0 10px 30px #0000001f}
#boot-status h1{font-size:20px;letter-spacing:.42em;font-weight:500;margin:22px 0 6px;padding-left:.42em}#boot-status p{color:#77736c;line-height:1.65;font-size:12px;letter-spacing:.12em}
#boot-error{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;color:#b42318;text-align:left;background:#fff1f1;padding:12px;border-radius:9px}
</style>
</head><body>
<div id="root"></div>
<div id="boot-status" role="status"><div class="boot-inner"><img src="./brand/icon-180.png" alt=""/><h1>VANILLA AI</h1><p id="boot-message">正在載入家庭 AI 工作空間…</p><pre id="boot-error" hidden></pre></div></div>
<script>
(function(){
  var boot=document.getElementById("boot-status");
  var msg=document.getElementById("boot-message");
  var error=document.getElementById("boot-error");
  function fail(reason){if(!boot)return;boot.style.display="flex";msg.textContent="Vanilla 載入失敗。請將下方錯誤截圖回報。";error.hidden=false;error.textContent=String(reason).slice(0,600);}
  window.__vanillaBootOk=function(){if(boot)boot.remove();};
  window.__vanillaBootError=fail;
  window.addEventListener("error",function(e){
    var t=e.target;
    if(t && t!==window && t.tagName){
      var source=t.src||t.href||"(未提供資源網址)";
      if(t.tagName==="LINK" && /manifest/.test(source))return;
      fail("資源載入失敗 ["+t.tagName+"]\n"+source+"\n目前網址："+location.href);
    }else fail((e.message||"JavaScript 執行錯誤")+"\n"+(e.filename||"")+" : "+(e.lineno||""));
  },true);
  window.addEventListener("unhandledrejection",function(e){fail(e.reason&&e.reason.message||e.reason||"Promise error");});
  // Slow mobile networks can need longer on first load; only flag a real stall.
  setTimeout(function(){if(document.getElementById("boot-status"))fail("逾時：前端程式未能完成初始化。請確認網路連線、GitHub Pages 部署成功及網站網址正確。");},25000);
})();
</script>
<script type="module" src="/src/main.tsx"></script>
</body></html>
