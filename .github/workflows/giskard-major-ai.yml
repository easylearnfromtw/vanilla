name: Hank AI Quality Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      depth:
        description: "Manual run: checks or full live vulnerability scan (main only)"
        required: true
        type: choice
        default: checks
        options: [checks, full]

permissions:
  contents: read

concurrency:
  group: hank-ai-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Hank / Classify AI changes
    runs-on: ubuntu-latest
    outputs:
      major: ${{ steps.detect.outputs.major }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate classification policy
        run: python3 -m unittest discover -s tests -p 'test_giskard_change_detector.py'
      - name: Validate Hank / Tracely safety contracts
        run: python3 -m unittest discover -s tests -p 'test_hank_tracely.py'
      - name: Classify source change or owner override
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ai-major') }}
        run: |
          args=(--base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT")
          if [[ "$IS_PR" == "true" ]]; then args+=(--pr); fi
          if [[ "$FORCE" == "true" ]]; then args+=(--force); fi
          python3 scripts/giskard-change-detector.py "${args[@]}"
      - name: Save classification evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hank-classification
          path: artifacts/giskard-change-report.json
          if-no-files-found: ignore

  giskard-checks:
    name: Hank / Giskard regression
    needs: classify
    if: needs.classify.outputs.major == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DO_NOT_TRACK: "1"
      GISKARD_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Vanilla runtime and Giskard v3 Checks
        run: |
          npm install --no-audit --no-fund
          python -m pip install "giskard>=3,<4"
      - name: Hank regression against real Vanilla AI code (Giskard v3)
        run: python scripts/giskard-major-checks.py
      - name: Save synthetic Giskard regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hank-regression-results
          path: |
            artifacts/giskard-major-summary.json
            artifacts/giskard-major-junit.xml
          if-no-files-found: ignore

  giskard-live:
    name: Hank / Model vulnerability scan
    needs: [classify, giskard-checks]
    if: >-
      ${{ needs.classify.outputs.major == 'true' &&
          ((github.event_name == 'push' && vars.GISKARD_LIVE_ENABLED == 'true') ||
           (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.depth == 'full')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      DO_NOT_TRACK: "1"
      GISKARD_TELEMETRY_DISABLED: "1"
      GISKARD_TARGET_BASE_URL: ${{ vars.GISKARD_TARGET_BASE_URL }}
      GISKARD_TARGET_MODEL: ${{ vars.GISKARD_TARGET_MODEL }}
      GISKARD_JUDGE_MODEL: ${{ vars.GISKARD_JUDGE_MODEL }}
      GISKARD_TARGET_API_KEY: ${{ secrets.GISKARD_TARGET_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Giskard v3 vulnerability scan
        run: python -m pip install "giskard[scan,openai]>=3,<4"
      - name: Hank live red-team scan (trusted main only)
        run: python scripts/giskard-live-scan.py
      - name: Upload only aggregate counts, never model traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hank-live-aggregate
          path: artifacts/giskard-live-summary.json
          if-no-files-found: ignore

  tracely-gate:
    name: Hank / Tracely candidate scenarios
    needs: [classify, giskard-checks]
    if: >-
      ${{ needs.classify.outputs.major == 'true' &&
          needs.giskard-checks.result == 'success' &&
          vars.HANK_TRACELY_ENABLED == 'true' &&
          ((github.event_name == 'pull_request' &&
            vars.HANK_TRACELY_PR_GATE_ENABLED == 'true' &&
            github.event.pull_request.head.repo.full_name == github.repository) ||
           (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      TRACELY_API: ${{ vars.HANK_TRACELY_API }}
      HANK_TRACELY_AGENTS: ${{ vars.HANK_TRACELY_AGENTS }}
      HANK_TRACELY_REVISION_URL: ${{ vars.HANK_TRACELY_REVISION_URL }}
      HANK_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      HANK_TRACELY_TIMEOUT: "900"
    steps:
      # CI controls and secrets must never execute arbitrary PR branch scripts.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install reviewed Tracely SDK revision
        run: |
          python -m pip install --disable-pip-version-check \
            'git+https://github.com/jwuthri-cloud/Tracely-ai.git@e6a37cddb0a62b4a4b925b0f517532e541daa208#subdirectory=sdk'
      - name: Verify candidate revision then run private Tracely scenarios
        env:
          TRACELY_KEY: ${{ secrets.HANK_TRACELY_KEY }}
        run: python scripts/hank-tracely-gate.py
      - name: Upload only aggregate gate status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hank-tracely-aggregate
          path: artifacts/hank-tracely-summary.json
          if-no-files-found: ignore

  ceres-hank-alert:
    name: Ceres / Hank private failure notice
    needs: [giskard-checks, giskard-live, tracely-gate]
    if: >-
      ${{ always() &&
          (needs.giskard-checks.result == 'failure' ||
           needs.giskard-live.result == 'failure' ||
           needs.tracely-gate.result == 'failure') &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HANK_GISKARD_STATUS: ${{ needs.giskard-checks.result }}
      HANK_LIVE_STATUS: ${{ needs.giskard-live.result }}
      HANK_TRACELY_STATUS: ${{ needs.tracely-gate.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Send only fixed-label failure summary to verified Ceres owner chat
        env:
          HANK_CERES_BOT_TOKEN: ${{ secrets.HANK_CERES_BOT_TOKEN }}
          HANK_CERES_OWNER_CHAT_ID: ${{ secrets.HANK_CERES_OWNER_CHAT_ID }}
        run: |
          if [[ -f scripts/hank-ceres-notify.py ]]; then
            python3 scripts/hank-ceres-notify.py
          else
            echo "Ceres Hank notifier not yet available on base branch"
          fi
