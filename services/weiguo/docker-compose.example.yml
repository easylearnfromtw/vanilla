services:
  weiguo:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:9080:8080"
    environment:
      WEIGUO_ALLOWED_HOSTS: "example.org,www.example.org"
      # Use ONLY private server-side environment variables.
      WEIGUO_ADMIN_TOKEN: "${WEIGUO_ADMIN_TOKEN:?Required}"
      # Same public OAuth client ID as src/vault/google-auth.ts (not a secret).
      WEIGUO_GOOGLE_CLIENT_ID: "${WEIGUO_GOOGLE_CLIENT_ID:?Required}"
      # Independent server-only HMAC key; must differ from operator token.
      WEIGUO_SESSION_SECRET: "${WEIGUO_SESSION_SECRET:?Required}"
      # JSON keyed by the verified Google "sub", never by a user-supplied email/name.
      WEIGUO_FAMILY_ACL_JSON: "${WEIGUO_FAMILY_ACL_JSON:?Required}"
      # Explicit HTTPS origin for the PWA, without /vanilla path.
      WEIGUO_CORS_ORIGINS: "https://easylearnfromtw.github.io"
      WEIGUO_TASK_DB: "/data/weiguo-tasks.sqlite3"
      # Ceres is opt-in; NEVER place credentials in the public PWA.
      CERES_ENABLED: "false"
      CERES_DB_PATH: "/data/ceres-events.sqlite3"
      CERES_OUTBOUND_ENABLED: "false"
      CERES_AI_DRAFT_ENABLED: "false"
      # CERES_FAMILY_LINKS_JSON: '{"123456789":"verified-google-sub"}'
      # CERES_TELEGRAM_BOT_TOKEN: "${CERES_TELEGRAM_BOT_TOKEN}"
      # CERES_OLLAMA_URL: "http://127.0.0.1:11434" # loopback only, optional
      # CERES_OLLAMA_MODEL: "qwen3:4b"
      # CERES_TELEGRAM_WEBHOOK_SECRET: "${CERES_TELEGRAM_WEBHOOK_SECRET:?Required when enabled}"
      # CERES_TELEGRAM_CHAT_IDS: "${CERES_TELEGRAM_CHAT_IDS:?Required when enabled}"
      # Notion integration remains disabled unless server-only token and data-source ID are configured.
      WEIGUO_NOTION_ENABLED: "false"
      # WEIGUO_NOTION_TOKEN: "${WEIGUO_NOTION_TOKEN}"
      # WEIGUO_NOTION_DATA_SOURCE_ID: "${WEIGUO_NOTION_DATA_SOURCE_ID}"
      LUCA_ENABLED: "false"
      LUCA_DB: "/data/luca.sqlite3"
      # Optional local OTLP collector:
      # LUCA_OTLP_ENDPOINT: "http://otel-collector:4318/v1/traces"
      WEIGUO_ALLOW_JAVASCRIPT: "false"
      # Default preserves the reviewed Chromium route. Moli is not bundled.
      WEIGUO_BROWSER_ENGINE: "chromium"
      # Only true AFTER a real egress host/domain firewall/proxy is enforced.
      WEIGUO_MOLI_EGRESS_ISOLATED: "false"
      WEIGUO_ALLOW_MUTATIONS: "false"
      # Optional: enable only after installing a reviewed gridcraft-cli binary
      # into the trusted backend PATH. No binary is bundled in this image.
      WEIGUO_GRIDCRAFT_ENABLED: "false"
      # Medusa / Judge0 is never public, opt-in only.
      MEDUSA_ENABLED: "false"
      MEDUSA_SANDBOX_EGRESS_BLOCKED: "false"
      MEDUSA_FAMILY_ENABLED: "false"
      # Medusa Lite: restricted Python subset on this WeiGuo server; no separate cloud
      MEDUSA_LITE_ENABLED: "false"
      MEDUSA_LITE_OWNER_ROLE_ONLY: "false" # Only existing verified owner role; Lite only
      # Set MEDUSA_ENGINE: "lite" only after testing and authorizing family owner
      # MEDUSA_FAMILY_OWNER_SUBS: "verified Google sub"
      # MEDUSA_JUDGE0_URL: "http://judge0:2358"
      # MEDUSA_PYTHON_LANGUAGE_ID: "109" # Verify the deployment language ID first.
      # WordCraft remains off. Never attest to isolation until enforced at the host/VPC.
      WEIGUO_WORDCRAFT_ENABLED: "false"
      WEIGUO_WORDCRAFT_EGRESS_ISOLATED: "false"
      # Optional PdfCraft CLI: default disabled and not shipped in this image.
      WEIGUO_PDFCRAFT_ENABLED: "false"
      WEIGUO_PDFCRAFT_EGRESS_ISOLATED: "false"
      # Production additionally requires a reviewed binary, SHA-256 digest,
      # host-level network denial and filesystem/process isolation.
      # Once a trusted binary is deployed, set WEIGUO_WORDCRAFT_SHA256 server-side
      # to the actual independently verified 64-digit digest, NOT to an example value.
      # Set true for any publicly routed family-only Railway instance.
      WEIGUO_PUBLIC_FAMILY_ONLY: "false"
      # Only set these for a trusted internal Ollama instance, never public URLs:
      # WEIGUO_OLLAMA_URL: "http://ollama:11434"
      # WEIGUO_OLLAMA_MODEL: "qwen3:4b"
    volumes:
      - weiguo_tasks:/data
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m
    pids_limit: 180
    mem_limit: 1g
    # DNS rebinding is not blocked by application URL validation alone.
    # Restrict container egress/private IP ranges at the host/VPC firewall.

volumes:
  weiguo_tasks:
