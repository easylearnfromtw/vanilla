name: Windows Node installer
on:
  workflow_dispatch:
  push:
    tags: ['windows-node-v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package agent
        run: |
          python -m pip install --upgrade pip pyinstaller
          pyinstaller --noconfirm --clean --onefile --windowed --name VanillaNode services/windows-node/agent.py
      - name: Package installer
        shell: powershell
        run: |
          $compiler = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) { throw 'Inno Setup 6 missing' }
          & $compiler 'services\windows-node\installer.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: SHA256
        shell: powershell
        run: Get-FileHash 'dist\Vanilla-Windows-Node-Setup.exe' -Algorithm SHA256 | Format-List | Out-File 'dist\SHA256.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: vanilla-windows-node-installer
          path: |
            dist/Vanilla-Windows-Node-Setup.exe
            dist/SHA256.txt
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/windows-node-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: powershell
        run: gh release create $env:GITHUB_REF_NAME 'dist/Vanilla-Windows-Node-Setup.exe' 'dist/SHA256.txt' --title "Vanilla Windows Node $env:GITHUB_REF_NAME" --notes 'Unsigned Windows installer. Verify SHA256 before installing.'
