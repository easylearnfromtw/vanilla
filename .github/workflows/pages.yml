name: Deploy Vanilla PWA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run test:workspace
      - run: npm run test:builder
      - run: npm run test:local-chat
      - run: npm run test:webllm-guard
      - run: npm run test:assistant
      - run: npm run test:resource-integration
      - run: npm run test:capabilities
      - run: npm run test:security
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
      - name: Verify compiled GitHub Pages assets
        run: |
          test -f dist/index.html
          test -d dist/assets
          grep -q '/vanilla/assets/' dist/index.html
          if grep -q '/src/main.tsx' dist/index.html; then
            echo "::error::dist/index.html still references TypeScript source instead of bundled assets"
            exit 1
          fi
          echo "Verified compiled index.html and /vanilla/assets/ paths"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
