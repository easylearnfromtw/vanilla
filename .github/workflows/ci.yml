name: Vanilla CI
concurrency:
  group: vanilla-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/vanilla-core-pwa]
permissions:
  contents: read
jobs:
  frontend:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Regression tests
        run: |
          npm run test:local-chat
          npm run test:webllm-guard
          npm run test:assistant
          npm run test:resource-integration
          npm run test:cream
          npm run test:cream-extra
          npm run test:weiguo
          npm run test:weiguo-auth-ui
          npm run test:detroit
          npm run test:merlin
          npm run test:cream-weiguo
          npm run test:detroit-studio
          npm run test:retina
          npm run test:detroit-notifications
          npm run test:cream-longitudinal
          npm run test:cream-google
          npm run test:noodles
          npm run test:noodles-teacher
          npm run test:auto-docs
          npm run test:chat-ui
          npm run test:release
          npm run test:web-workflows
          npm run test:capabilities
          npm run test:security
          npm run test:workspace
          npm run test:builder
          npm run test:autocode
          npm run test:file-lifecycle
          npm run test:drive-orphan
          npm run test:taide
          npm run test:chat-router
          npm run test:model-tuning
          npm run test:archive
          npm run test:providers
      - name: Athena private scanner unit tests (no AV daemon)
        run: python3 -m unittest discover -s services/detroit-scanner -p 'test_*.py'
      - name: Install 衞國 authentication test dependencies
        run: python3 -m pip install --user -r services/weiguo/requirements.txt
      - name: 衞國 browser policy and identity gateway tests
        run: python3 -m unittest discover -s services/weiguo -p 'test_*.py'
      - name: Validate NOODLES GPU trainer syntax and sample JSONL (no GPU)
        run: |
          python3 -m py_compile training/noodles_train.py
          python3 training/noodles_train.py --mode sft --train tests/fixtures/noodles-sft-train.jsonl --eval tests/fixtures/noodles-sft-eval.jsonl --check-only
          python3 training/noodles_train.py --mode dpo --train tests/fixtures/noodles-dpo-train.jsonl --eval tests/fixtures/noodles-dpo-eval.jsonl --check-only
      - name: Typecheck and build
        run: npm run build
        env:
          GITHUB_PAGES: "true"
      - name: Verify output
        run: test -f dist/index.html && test -f dist/manifest.webmanifest

  moli-release-smoke:
    timeout-minutes: 12
    name: Verify pinned Moli CLI (no production activation)
    runs-on: ubuntu-latest
    steps:
      - name: Verify SHA-256 of official Linux binary
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --show-error --silent --retry 3 --connect-timeout 15 --max-time 240 \
            -o /tmp/moli-release.tar.gz \
            https://github.com/lexmount/moli/releases/download/v1.1.18/moli-x86_64-unknown-linux-gnu.tar.gz
          printf '%s  %s\n' \
            59715fbdb2b016bb9136e1edb59a2a195c0f98459fd06739e17edc62da6a48b1 \
            /tmp/moli-release.tar.gz | sha256sum --check -
          mkdir /tmp/moli-release
          tar -xzf /tmp/moli-release.tar.gz -C /tmp/moli-release
          test "$(find /tmp/moli-release -type f -name moli | wc -l)" = "1"
          install -m 0755 "$(find /tmp/moli-release -type f -name moli -print -quit)" /tmp/moli
          /tmp/moli --version
      - name: Browser smoke test (public content; private IP blocked)
        shell: bash
        run: |
          set -euo pipefail
          /tmp/moli fetch --dump markdown --wait-until done --timeout 15000 \
            --disable-js --disable-subframes --block-private-networks --fail \
            https://example.org/ > /tmp/example.md
          grep -qi "Example Domain" /tmp/example.md
          if /tmp/moli fetch --dump markdown --timeout 3000 \
              --disable-js --disable-subframes --block-private-networks \
              https://127.0.0.1/ >/tmp/private-network.txt 2>/tmp/private-network.err; then
            echo "::error::Moli unexpectedly reached a prohibited private destination"
            exit 1
          fi
          echo "Moli public read succeeded and direct private target was rejected"
