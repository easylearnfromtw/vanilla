<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vanilla Notion 網頁橋接</title>
  <style>
    body{font:14px/1.5 system-ui,sans-serif;width:330px;padding:14px;margin:0;color:#182333;background:#f8fafc}
    h1{font-size:18px;margin:0 0 10px}
    label{display:block;margin:12px 0 5px;font-weight:600}
    textarea{box-sizing:border-box;width:100%;height:120px;resize:vertical;border:1px solid #bcc6d4;border-radius:8px;padding:9px}
    button{border:0;border-radius:8px;background:#173660;color:#fff;padding:10px;cursor:pointer;width:100%;margin-top:12px}
    button:disabled{opacity:.55;cursor:default}
    #status{white-space:pre-wrap;margin-top:10px}
    p{margin:8px 0;color:#435065}
  </style>
</head>
<body>
  <h1>Vanilla → Notion</h1>
  <p>先在已登入的 Notion 開啟<strong>新空白頁</strong>，點入空白的標題編輯欄。此工具不需要 API Key，也不讀取登入 Cookie。</p>
  <label for="payload">從 Vanilla 複製的單筆任務 JSON</label>
  <textarea id="payload" spellcheck="false" placeholder="貼上 Vanilla 產生的任務 JSON"></textarea>
  <button type="button" id="fill">確認將標題寫入目前聚焦的空白欄位</button>
  <p id="status" role="status" aria-live="polite">不會自動操作日期、完成狀態或背景同步。</p>
  <script src="popup.js"></script>
</body>
</html>
