name: Deploy Vanilla PWA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      expected_build: ${{ steps.release.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - name: Pin release version for deployment verification
        id: release
        run: |
          build="$(node -p "JSON.parse(require('fs').readFileSync('public/version.json','utf8')).build")"
          test -n "$build"
          echo "build=$build" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run test:workspace
      - run: npm run test:builder
      - run: npm run test:autocode
      - run: npm run test:file-lifecycle
      - run: npm run test:drive-orphan
      - run: npm run test:taide
      - run: npm run test:local-chat
      - run: npm run test:webllm-guard
      - run: npm run test:assistant
      - run: npm run test:resource-integration
      - run: npm run test:cream
      - run: npm run test:detroit
      - run: npm run test:detroit-studio
      - run: npm run test:retina
      - run: npm run test:detroit-notifications
      - run: npm run test:cream-longitudinal
      - run: npm run test:cream-google
      - run: npm run test:noodles
      - run: npm run test:noodles-teacher
      - run: npm run test:auto-docs
      - run: npm run test:chat-ui
      - run: npm run test:release
      - run: npm run test:pwa-update
      - run: npm run test:web-workflows
      - run: npm run test:capabilities
      - run: npm run test:security
      - run: npm run test:chat-router
      - run: npm run test:model-tuning
      - run: npm run test:archive
      - run: npm run test:providers
      - name: Athena private scanner unit tests (no AV daemon)
        run: python3 -m unittest discover -s services/detroit-scanner -p 'test_*.py'
      - name: Validate NOODLES trainer (no GPU)
        run: |
          python3 -m py_compile training/noodles_train.py
          python3 training/noodles_train.py --mode sft --train tests/fixtures/noodles-sft-train.jsonl --eval tests/fixtures/noodles-sft-eval.jsonl --check-only
          python3 training/noodles_train.py --mode dpo --train tests/fixtures/noodles-dpo-train.jsonl --eval tests/fixtures/noodles-dpo-eval.jsonl --check-only
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
      - name: Verify compiled GitHub Pages assets
        run: |
          test -f dist/index.html
          test -d dist/assets
          grep -q '/vanilla/assets/' dist/index.html
          if grep -q '/src/main.tsx' dist/index.html; then
            echo "::error::dist/index.html still references TypeScript source instead of bundled assets"
            exit 1
          fi
          echo "Verified compiled index.html and /vanilla/assets/ paths"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify actually published Vanilla version
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_BUILD: ${{ needs.build.outputs.expected_build }}
        run: |
          set -euo pipefail
          test -n "$PAGES_URL"
          test -n "$EXPECTED_BUILD"
          base="${PAGES_URL%/}"
          for attempt in $(seq 1 15); do
            result="$(curl -fsSL --connect-timeout 6 --max-time 15 -H 'Cache-Control: no-cache' "$base/version.json?verify=${GITHUB_RUN_ID}-${attempt}" || true)"
            actual="$(printf '%s' "$result" | python3 -c 'import json,sys; value=json.load(sys.stdin); print(value.get("build", ""))' 2>/dev/null || true)"
            if [ "$actual" = "$EXPECTED_BUILD" ]; then
              html="$(curl -fsSL --connect-timeout 6 --max-time 15 -H 'Cache-Control: no-cache' "$base/?verify=${GITHUB_RUN_ID}-${attempt}" || true)"
              if [[ "$html" == *"/vanilla/assets/"* ]]; then
                echo "Verified GitHub Pages release: $actual"
                exit 0
              fi
            fi
            echo "Attempt $attempt: live release ${actual:-unavailable}, expected $EXPECTED_BUILD; waiting for Pages propagation"
            sleep 10
          done
          echo "::error::Pages deployment was not verified. Expected $EXPECTED_BUILD at $base/version.json, found ${actual:-unavailable}. Check Pages environment URL, Actions permissions and cache."
          exit 1
