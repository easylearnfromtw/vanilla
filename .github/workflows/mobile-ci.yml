name: Verify Mobile Agent Integration
on:
  pull_request:
    paths:
      - "src/mobile/**"
      - "src/App.tsx"
      - "src/local-ai/LocalChat.tsx"
      - "src/assistant/intent-router.ts"
      - "tests/mobile-automation.test.mjs"
      - "package.json"
      - ".github/workflows/mobile-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run test:mobile
      - run: npm run test:security
      - run: npm run test:assistant
      - run: npm run test:workspace
      - run: npm run test:builder
      - run: npm run build
