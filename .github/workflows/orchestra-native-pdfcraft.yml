name: Orchestra PdfCraft native release smoke
on:
  pull_request:
    paths:
      - 'services/weiguo/Dockerfile.pdfcraft'
      - 'services/weiguo/pdfcraft_engine.py'
      - 'services/weiguo/pdfcraft_native.py'
      - 'services/weiguo/native_pdfcraft_smoke.py'
      - '.github/workflows/orchestra-native-pdfcraft.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-native-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify pinned upstream Linux CLI archive
        shell: bash
        run: |
          set -euo pipefail
          URL='https://github.com/storytold/pdfcraft/releases/download/v0.9.0/pdfcraft-cli-0.9.0-linux-x86_64.tar.gz'
          EXPECTED='cdba2bec4d502d016dd78101a402d07845b708c49d77bc85e0ab640aca65372b'
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 12 --max-time 150 "$URL" -o /tmp/pdfcraft-release.tar.gz
          printf '%s  %s\n' "$EXPECTED" /tmp/pdfcraft-release.tar.gz | sha256sum --check --status
          python3 - <<'PY'
          import tarfile
          with tarfile.open('/tmp/pdfcraft-release.tar.gz') as t:
              names=[m.name for m in t.getmembers()]
              for m in t.getmembers():
                  if m.name.startswith('/') or '..' in m.name.split('/') or m.issym() or m.islnk() or m.isdev():
                      raise SystemExit('Archive path/link/device rejected: '+m.name)
              print('Release entries:', names[:20])
          PY
          mkdir -p /tmp/pdfcraft-release
          tar -xzf /tmp/pdfcraft-release.tar.gz -C /tmp/pdfcraft-release
          CLI="$(find /tmp/pdfcraft-release -type f -name pdfcraft-cli -print -quit)"
          test -n "$CLI"
          chmod +x "$CLI"
          printf 'PDFCRAFT_CLI=%s\n' "$CLI" >> "$GITHUB_ENV"
          sha256sum "$CLI"
          printf '### PdfCraft Linux v0.9.0\nCLI SHA256: `%s`\n' "$(sha256sum "$CLI" | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
      - name: Generate independent PDF fixtures and assert exact native merge
        run: |
          python3 -m pip install --disable-pip-version-check reportlab pypdf
          python3 services/weiguo/native_pdfcraft_smoke.py "$PDFCRAFT_CLI"
      - name: Build optional pinned Railway image and inspect installed CLI
        timeout-minutes: 16
        run: |
          docker build --file services/weiguo/Dockerfile.pdfcraft --tag vanilla-pdfcraft-native:ci services/weiguo
          docker run --rm --entrypoint /bin/sh vanilla-pdfcraft-native:ci -c \
            'set -eu; printf "%s  %s\n" "$WEIGUO_PDFCRAFT_SHA256" "$WEIGUO_PDFCRAFT_CLI" | sha256sum -c -; command -v bwrap; test "$WEIGUO_PDFCRAFT_ENABLED" = false'
