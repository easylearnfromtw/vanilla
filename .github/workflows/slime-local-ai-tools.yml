name: Slime local Owner AI tools
on:
  pull_request:
    branches: [main, feature/octuber-local-multisize-qlora-20261025]
    paths:
      - "services/slime/desktop.py"
      - "services/slime/local_model_tools.py"
      - "services/slime/local_model_window.py"
      - "tests/test_slime_local_model_tools.py"
      - "services/slime/training_evidence.py"
      - "tests/test_slime_training_evidence.py"
      - ".github/workflows/slime-local-ai-tools.yml"
      - ".github/workflows/slime-desktop.yml"
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONIOENCODING: utf-8
jobs:
  offline-local-tool-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify local Owner-only tool and QLoRA security gates without a GPU
        shell: bash
        run: |
          python -m py_compile services/slime/local_model_tools.py services/slime/local_model_window.py services/slime/desktop.py services/slime/training_evidence.py
          python -m unittest discover -s tests -p "test_slime_local_model_tools.py" -v
          python -m unittest discover -s tests -p "test_slime_training_evidence.py" -v
      - name: Validate existing Owner / Friend Slime onboarding stays intact
        shell: bash
        run: |
          python -m unittest discover -s tests -p "test_slime_desktop.py" -v
      - name: Explicitly prevent fake GPU/adapter success reporting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path("services/slime")
          assert "if ROLE == \"owner\"" in (root/"desktop.py").read_text(encoding="utf-8")
          models=(root/"local_model_tools.py").read_text(encoding="utf-8")
          assert "preflight-eligible-untrained" in models
          assert "actual_model_weights_verified" in models
          assert "ProxyHandler({})" in models
          assert "--allow-download" in models
          print("SLIME_OWNER_TOOL_INTEGRATION_TESTED_NO_GPU_DOWNLOAD_OR_TRAINING_EXECUTED")
          PY

  windows-unsigned-preview:
    needs: offline-local-tool-tests
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create locally executable preview (no auto-install or publication)
        shell: pwsh
        run: |
          python -m pip install "pyinstaller>=6.10,<7"
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name Slime-Owner services/slime/desktop.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name Slime-Friend services/slime/desktop.py
          if (!(Test-Path dist/Slime-Owner.exe) -or !(Test-Path dist/Slime-Friend.exe)) { throw "SLIME_WINDOWS_EXECUTABLE_NOT_CREATED" }
          Get-FileHash -Algorithm SHA256 dist/Slime-Owner.exe,dist/Slime-Friend.exe | Format-Table
      - name: Upload owner-tested PREVIEW ONLY, unsigned and not deployed
        uses: actions/upload-artifact@v4
        with:
          name: slime-local-qwen-owner-friend-windows-UNSIGNED-preview
          path: |
            dist/Slime-Owner.exe
            dist/Slime-Friend.exe
          if-no-files-found: error
          retention-days: 7
